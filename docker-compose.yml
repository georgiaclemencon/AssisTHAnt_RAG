# Pinned project name so volume names stay stable regardless of the
# folder name this repo is cloned into (e.g. quickusage/Start.bat and
# quickusage/start.sh, quickusage/Purge-Analysis.bat and
# quickusage/purge-analysis.sh reference volumes by their full name:
# assisthant-rag_lightrag_data, etc.)
name: assisthant-rag

services:

  # ── 1. Ollama — local LLM server ──────────────────────────────
  # Port 11435 (instead of the default 11434) to avoid clashing with
  # a native Ollama install that might already be running on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11435
    ports:
      - "127.0.0.1:11435:11435"   # localhost only — not exposed on the network
    volumes:
      - ollama_data:/root/.ollama   # models persisted across restarts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── 2. Model download (runs once) ─────────────────────────────
  # Pulls whatever LLM_MODEL / EMBEDDING_MODEL are set to in .env, so
  # changing the model only ever requires editing .env — see the
  # "Changing the model" section in README.md.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11435
    entrypoint: >
      sh -c "
        ollama pull ${LLM_MODEL:-phi4-mini:3.8b-q4_K_M} &&
        ollama pull ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      "
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"   # runs once then exits

  # ── 3. LightRAG Server + Web UI — knowledge base ──────────────
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:9621:9621"     # localhost only — not exposed on the network
    volumes:
      - lightrag_data:/app/data     # index + metadata, persisted
      # With WORKSPACE set, LightRAG actually scans inputs/<workspace>/ —
      # mounting straight onto that path means dropping a file into
      # knowledge_base/ works with no extra subfolder needed.
      - ./knowledge_base:/app/data/inputs/kb
    environment:
      # ── Server ─────────────────────────────────────────────
      PORT: 9621
      WEBUI_TITLE: "Document Assistant"
      WEBUI_DESCRIPTION: "100% local — no data ever leaves this machine"
      # Dedicated workspace: isolates this store from the
      # lightrag-analysis service (sensitive documents), see below.
      WORKSPACE: kb

      # ── LLM (Ollama container by default, LM Studio optional via .env) ─
      LLM_BINDING: ${LLM_BINDING:-ollama}
      LLM_MODEL: ${LLM_MODEL:-phi4-mini:3.8b-q4_K_M}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST:-http://ollama:11435}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY:-not-needed}
      # CPU only (no GPU) → entity extraction can take several minutes
      # on large chunks. LightRAG's default (240s) is too short.
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-120}

      # ── Indexing speed (CPU only) ──────────────────────────
      # MAX_GLEANING=0: skips a 2nd LLM call per chunk ("did I miss
      # anything?"), roughly halves the number of extraction calls.
      MAX_GLEANING: ${MAX_GLEANING:-0}
      # Bigger chunks = fewer chunks = fewer times the large, fixed
      # extraction system prompt gets replayed.
      CHUNK_SIZE: ${CHUNK_SIZE:-2000}
      CHUNK_OVERLAP_SIZE: ${CHUNK_OVERLAP_SIZE:-150}

      # ── Embeddings (same idea) ──────────────────────────────
      EMBEDDING_BINDING: ${EMBEDDING_BINDING:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST:-http://ollama:11435}

      # ── No reranker, no OpenSearch ──────────────────────────
      RERANK_BINDING: "null"

      SUMMARY_LANGUAGE: ${SUMMARY_LANGUAGE:-English}

  # ── 4. LightRAG — confidential analysis (sensitive documents) ─
  # Separate instance: dedicated volume and workspace, never mixed
  # with the "lightrag" knowledge base service above.
  # To purge after an analysis: quickusage/Purge-Analysis.bat / purge-analysis.sh
  # (removes only lightrag_analyse_data, never touches lightrag_data)
  #
  # Indexes confidential_documents/ ONLY — no copy of the KB here:
  # re-indexing the whole KB into this workspace would cost as much as
  # the original indexing (same LLM calls repeated). If a question
  # needs to cross-reference the general knowledge base, query the KB
  # tab too (http://localhost:9621/webui/) — no re-indexing needed.
  lightrag-analyse:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-analyse
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:9622:9621"     # different port — separate instance
    volumes:
      - lightrag_analyse_data:/app/data                       # dedicated volume, never shared
      - ./confidential_documents:/app/data/inputs/confidential
    environment:
      PORT: 9621
      WEBUI_TITLE: "Confidential Analysis"
      WEBUI_DESCRIPTION: "Isolated zone — purge after analysis, not shared with the knowledge base"
      WORKSPACE: confidential

      LLM_BINDING: ${LLM_BINDING:-ollama}
      LLM_MODEL: ${LLM_MODEL:-phi4-mini:3.8b-q4_K_M}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST:-http://ollama:11435}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY:-not-needed}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-120}

      MAX_GLEANING: ${MAX_GLEANING:-0}
      CHUNK_SIZE: ${CHUNK_SIZE:-2000}
      CHUNK_OVERLAP_SIZE: ${CHUNK_OVERLAP_SIZE:-150}

      EMBEDDING_BINDING: ${EMBEDDING_BINDING:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST:-http://ollama:11435}

      RERANK_BINDING: "null"
      SUMMARY_LANGUAGE: ${SUMMARY_LANGUAGE:-English}

volumes:
  ollama_data:            # Ollama models
  lightrag_data:          # knowledge base (kb) index
  lightrag_analyse_data:  # confidential documents index (purge after use)
